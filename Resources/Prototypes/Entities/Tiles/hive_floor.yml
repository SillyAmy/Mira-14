- type: entity
  id: FloorHiveEntity
  name: hive ground
  description: Floor secreted by a space wasp to make the place look the part.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/Planet/liquid_plasma.rsi
    drawdepth: FloorTiles
    layers:
    - state: hive
  - type: Icon
    sprite: Tiles/Misc/hive.rsi
    state: full
  - type: IconSmooth
    key: floor
    base: hive
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Tag
    tags:
    - HideContextMenu
