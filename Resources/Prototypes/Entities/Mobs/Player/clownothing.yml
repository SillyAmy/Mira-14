- type: entity
  parent: BaseMobDragon
  id: Clownothing
  name: clownothing
  description: A... OH MY GOD WHAT THE ABSOLUTE HONKITY HONK!
  components:
  - type: Bloodstream
    bloodMaxVolume: 650
    bloodReagent: Laughter
  - type: GhostRole
    name: ghost-role-information-clownothing-name
    description: ghost-role-information-clownothing-description
    rules: ghost-role-information-clownothing-rules
  - type: NpcFactionMember
    factions:
    - Clown
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5
    weightlessModifier: 1.5
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/clownothing.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: clownothing
  - type: DamageStateVisuals
    states:
      Alive:
        Base: clownothing
      Critical:
        Base: clownothing_critical
      Dead:
        Base: clownothing_dead
  - type: Physics
    bodyType: KinematicController
  - type: MobThresholds
    thresholds:
      0: Alive
      325: Critical
      450: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      250: 0.7
      400: 0.5
  - type: Butcherable
    spawned:
    - id: FoodMeatDragon
      amount: 2
  - type: InteractionPopup
    successChance: 0.25 # It's no goose, but you better smell like carp.
    interactSuccessString: petting-success-dragon
    interactFailureString: petting-failure-dragon
    interactFailureSound:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundPerceivedByOthers: false # A 75% chance for a loud roar would get old fast.
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcPunch
    soundHit:
      collection: BikeHorn
    damage:
      types:
        Piercing: 12.5
        Slash: 17.5
  - type: Devourer
    chemical: Laughter
    healRate: 10.0
    whitelist:
      components:
      - MobState
      - Door
      tags:
      - Wall
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
      params:
        variation: 0.17
        volume: 3
  - type: Dragon
    spawnRiftAction: ActionSpawnRift
  - type: ActionGun
    action: ActionDragonsBreath
    gunProto: DragonsBreathGun
  - type: GuideHelp
    guides:
    - MinorAntagonists

- type: entity
  categories: [ HideSpawnMenu ]
  id: ClownothingBreathGun
  name: clownothing's lung
  description: For clownothing's breathing.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 5
    rechargeSound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileDragonsBreath
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundEmpty: null
    projectileSpeed: 5

- type: entity
  id: ActionSpawnRiftClownothing
  name: Summon Clown Rift
  description: Summons a clown rift that will periodically spawns clown things.
  components:
  - type: InstantAction
    icon:
      sprite: Interface/Actions/carp_rift.rsi
      state: icon
    event: !type:DragonSpawnRiftActionEvent
    useDelay: 1
    priority: 3

- type: entity
  id: ActionClownothingBreath
  name: "[color=orange]Dragon's Breath[/color]"
  description: Spew out flames at anyone foolish enough to attack you!
  components:
  - type: WorldTargetAction
    # TODO: actual sprite
    icon: { sprite : Objects/Weapons/Guns/Projectiles/magic.rsi, state: fireball }
    event: !type:ActionGunShootEvent
    priority: 2
    checkCanAccess: false
    range: 0
    itemIconStyle: BigAction

- type: entity
  name: clown thing
  id: clownthing
  description: Just run. Why would you even face this thing.
  suffix: ClownBrood
  parent: [BaseMob, MobCombat]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/clown_things.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-clownthings-name
    description: ghost-role-information-clownthings-description
    rules: ghost-role-information-space-dragon-summoned-carp-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: HTN
    rootTask:
      task: DragonCarpCompound
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcPunch
    soundHit:
      collection: BikeHorn
    damage:
      types:
        Blunt: 5
        Slash: 7
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
      params:
        variation: 0.17
        volume: 3
  - type: NpcFactionMember
    factions:
    - Clown
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
